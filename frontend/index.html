<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tesla NAS Upload</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--red:#e82127;--bg:#090909;--surface:#111114;--surface2:#18181d;--border:#252530;--text:#e8e8f0;--dim:#606075;--green:#00d46a;--amber:#f5a623;--blue:#4e9af1}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:"Rajdhani",sans-serif;font-size:16px;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(rgba(232,33,39,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(232,33,39,.025) 1px,transparent 1px);background-size:48px 48px}
#pinScreen{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:32px}
#pinScreen.hidden{display:none}
.pin-logo{display:flex;align-items:center;gap:16px}
.pin-logo svg{width:48px;height:48px}
.pin-logo-text{font-size:26px;font-weight:700;letter-spacing:5px;text-transform:uppercase}
.pin-box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:36px 40px;display:flex;flex-direction:column;align-items:center;gap:24px;min-width:300px}
.pin-label{font-family:"Share Tech Mono",monospace;font-size:11px;color:var(--dim);letter-spacing:3px;text-transform:uppercase}
.pin-dots{display:flex;gap:14px}
.pin-dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);transition:.15s}
.pin-dot.filled{background:var(--red);border-color:var(--red);box-shadow:0 0 8px rgba(232,33,39,.5)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:240px}
.pin-key{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:18px 0;font-size:22px;font-weight:700;text-align:center;cursor:pointer;transition:.1s;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.pin-key:active{background:var(--border)}
.pin-key.del{font-size:18px;color:var(--dim)}
.pin-key.wide{grid-column:span 3;font-size:14px;font-weight:700;letter-spacing:3px;color:var(--green)}
.pin-err{font-family:"Share Tech Mono",monospace;font-size:11px;color:var(--red);letter-spacing:2px;min-height:16px}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:24px 20px 60px;min-height:100vh;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:16px;flex-wrap:wrap;gap:10px}
.logo{display:flex;align-items:center;gap:12px}
.logo svg{width:38px;height:38px}
.logo-title{font-size:20px;font-weight:700;letter-spacing:4px;text-transform:uppercase}
.logo-sub{font-family:"Share Tech Mono",monospace;font-size:9px;color:var(--dim);letter-spacing:2px;margin-top:3px}
.hpills{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);padding:6px 12px;border-radius:4px;font-family:"Share Tech Mono",monospace;font-size:10px;color:var(--dim);letter-spacing:1px;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%}
.dot.g{background:var(--green);box-shadow:0 0 5px var(--green);animation:blink 2s infinite}
.dot.r{background:var(--red)}
.dot.a{background:var(--amber);animation:blink 1.2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.btn-logout{background:none;border:1px solid var(--border);color:var(--dim);padding:6px 14px;font-family:"Rajdhani",sans-serif;font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;border-radius:4px;cursor:pointer}
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:14px 16px;text-align:center}
.stat-card label{font-family:"Share Tech Mono",monospace;font-size:9px;color:var(--dim);letter-spacing:2px;text-transform:uppercase;display:block;margin-bottom:6px}
.stat-card span{font-size:20px;font-weight:700}
.stat-card:nth-child(1) span{color:var(--text)}
.stat-card:nth-child(2) span{color:var(--amber)}
.stat-card:nth-child(3) span{color:var(--green)}
.stat-card:nth-child(4) span{color:var(--blue)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border)}
.tab{padding:10px 18px;font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;border:none;background:none;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--text);border-bottom-color:var(--red)}
.tab-panel{display:none;flex-direction:column;gap:16px}
.tab-panel.active{display:flex}
.drop-zone{background:var(--surface);border:2px dashed var(--border);border-radius:8px;padding:48px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;cursor:pointer;text-align:center;min-height:220px}
.drop-zone.drag-over{border-color:var(--red)}
.drop-icon{width:60px;height:60px;border:2px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center}
.drop-icon svg{width:26px;height:26px;stroke:var(--dim)}
.drop-title{font-size:20px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
.drop-hint{font-family:"Share Tech Mono",monospace;font-size:10px;color:var(--dim);letter-spacing:1px}
.btn-browse{background:var(--red);color:#fff;border:none;padding:12px 30px;font-family:"Rajdhani",sans-serif;font-size:14px;font-weight:700;letter-spacing:3px;text-transform:uppercase;border-radius:4px;cursor:pointer}
#fileInput{display:none}
.q-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.q-card{background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:10px 14px;text-align:center}
.q-card label{font-family:"Share Tech Mono",monospace;font-size:8px;color:var(--dim);letter-spacing:2px;display:block;margin-bottom:4px}
.q-card span{font-size:17px;font-weight:700}
.sec-label{font-family:"Share Tech Mono",monospace;font-size:9px;color:var(--dim);letter-spacing:3px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.sec-label::after{content:"";flex:1;height:1px;background:var(--border)}
.file-list{display:flex;flex-direction:column;gap:7px}
.fi{background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:12px 16px;display:grid;grid-template-columns:36px 1fr 120px 72px;align-items:center;gap:12px}
.fi.done{border-color:rgba(0,212,106,.2)}
.fi.error{border-color:rgba(232,33,39,.25)}
.ftype{width:36px;height:36px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:"Share Tech Mono",monospace;font-size:7px;font-weight:700;letter-spacing:1px}
.ftype.video{background:rgba(232,33,39,.1);color:var(--red);border:1px solid rgba(232,33,39,.25)}
.ftype.image{background:rgba(0,212,106,.08);color:var(--green);border:1px solid rgba(0,212,106,.18)}
.ftype.doc{background:rgba(245,166,35,.08);color:var(--amber);border:1px solid rgba(245,166,35,.18)}
.ftype.other{background:rgba(120,120,160,.08);color:var(--dim);border:1px solid var(--border)}
.finfo{min-width:0}
.fname{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fmeta{font-family:"Share Tech Mono",monospace;font-size:9px;color:var(--dim);margin-top:2px;letter-spacing:1px}
.fprog .pb{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin-bottom:3px}
.fprog .pf{height:100%;border-radius:2px;width:0%;transition:width .2s ease}
.pf.uploading{background:var(--amber)}
.pf.done{background:var(--green)}
.pf.error{background:var(--red)}
.fprog .pp{font-family:"Share Tech Mono",monospace;font-size:9px;color:var(--dim);text-align:right;letter-spacing:1px}
.fst{font-family:"Share Tech Mono",monospace;font-size:9px;letter-spacing:1px;text-align:right;white-space:nowrap}
.fst.pending{color:var(--dim)}
.fst.uploading{color:var(--amber)}
.fst.done{color:var(--green)}
.fst.error{color:var(--red)}
.action-bar{display:flex;gap:10px}
.btn-primary{background:var(--red);color:#fff;border:none;padding:14px 0;font-family:"Rajdhani",sans-serif;font-size:15px;font-weight:700;letter-spacing:3px;text-transform:uppercase;border-radius:4px;cursor:pointer;flex:1}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-sec{background:transparent;color:var(--dim);border:1px solid var(--border);padding:14px 20px;font-family:"Rajdhani",sans-serif;font-size:13px;font-weight:600;letter-spacing:2px;text-transform:uppercase;border-radius:4px;cursor:pointer}
.browser-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.browser-search{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:9px 14px;font-family:"Share Tech Mono",monospace;font-size:11px;border-radius:4px;flex:1;outline:none;letter-spacing:1px}
.btn-icon{background:var(--surface2);color:var(--dim);border:1px solid var(--border);padding:9px 14px;font-family:"Rajdhani",sans-serif;font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;border-radius:4px;cursor:pointer}
.files-table{width:100%;border-collapse:collapse}
.files-table th{font-family:"Share Tech Mono",monospace;font-size:8px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;text-align:left;padding:9px 12px;border-bottom:1px solid var(--border)}
.files-table td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.03);font-size:12px;font-weight:500;vertical-align:middle}
.td-mono{font-family:"Share Tech Mono",monospace;font-size:9px;color:var(--dim)}
.td-actions{display:flex;gap:6px;justify-content:flex-end}
.btn-dl,.btn-rm{border:none;border-radius:3px;padding:5px 10px;font-family:"Rajdhani",sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;cursor:pointer}
.btn-dl{background:rgba(78,154,241,.12);color:var(--blue);border:1px solid rgba(78,154,241,.2)}
.btn-rm{background:rgba(232,33,39,.1);color:var(--red);border:1px solid rgba(232,33,39,.2)}
.empty-state{text-align:center;padding:48px;color:var(--dim);font-family:"Share Tech Mono",monospace;font-size:11px;letter-spacing:2px}
.chart-wrap{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:18px 20px}
.chart-title{font-family:"Share Tech Mono",monospace;font-size:9px;color:var(--dim);letter-spacing:3px;text-transform:uppercase;margin-bottom:14px}
.chart-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.chart-date{font-family:"Share Tech Mono",monospace;font-size:9px;color:var(--dim);width:80px;flex-shrink:0}
.chart-bar-bg{flex:1;height:10px;background:var(--surface2);border-radius:3px;overflow:hidden}
.chart-bar-fill{height:100%;background:var(--red);border-radius:3px}
.chart-val{font-family:"Share Tech Mono",monospace;font-size:9px;color:var(--dim);width:60px;text-align:right;flex-shrink:0}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--green);padding:11px 24px;border-radius:4px;font-family:"Share Tech Mono",monospace;font-size:10px;letter-spacing:2px;color:var(--text);opacity:0;transition:opacity .3s,transform .3s;z-index:100;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{border-left-color:var(--red)}
</style>
</head>
<body>
<div id="pinScreen">
<div class="pin-logo">
<svg viewBox="0 0 342 512" fill="none"><path d="M171 512S0 375 0 173c47.6-12.7 95.6-19.3 171-20.8C246.4 153.7 294.4 160.3 342 173 342 375 171 512 171 512z" fill="#e82127"/><path d="M171 0C114 0 79.8 4.4 0 16.3 7.9 47.7 18.9 62 31.4 71.4 68.5 63.2 111 59 171 59s102.5 4.2 139.6 12.4C323.1 62 334.1 47.7 342 16.3 262.2 4.4 228 0 171 0z" fill="#e82127"/><path d="M171 59c-60 0-102.5 4.2-139.6 12.4 20.4 14.8 55.9 22.1 92.6 24.1L105.4 256H130l41-169 41 169h24.6L217 95.5c36.7-2 72.2-9.3 92.6-24.1C272.5 63.2 231 59 171 59z" fill="#fff"/></svg>
<div class="pin-logo-text">NAS UPLOAD</div>
</div>
<div class="pin-box">
<div class="pin-label">ENTER ACCESS PIN</div>
<div class="pin-dots"><div class="pin-dot" id="pd0"></div><div class="pin-dot" id="pd1"></div><div class="pin-dot" id="pd2"></div><div class="pin-dot" id="pd3"></div></div>
<div class="pin-pad" id="pinPad">
<div class="pin-key" data-key="1">1</div><div class="pin-key" data-key="2">2</div><div class="pin-key" data-key="3">3</div>
<div class="pin-key" data-key="4">4</div><div class="pin-key" data-key="5">5</div><div class="pin-key" data-key="6">6</div>
<div class="pin-key" data-key="7">7</div><div class="pin-key" data-key="8">8</div><div class="pin-key" data-key="9">9</div>
<div class="pin-key del" data-action="del">DEL</div><div class="pin-key" data-key="0">0</div><div class="pin-key wide" data-action="submit">UNLOCK</div>
</div>
<div class="pin-err" id="pinErr"></div>
</div>
</div>
<div class="wrap">
<header>
<div class="logo">
<svg viewBox="0 0 342 512" fill="none"><path d="M171 512S0 375 0 173c47.6-12.7 95.6-19.3 171-20.8C246.4 153.7 294.4 160.3 342 173 342 375 171 512 171 512z" fill="#e82127"/><path d="M171 0C114 0 79.8 4.4 0 16.3 7.9 47.7 18.9 62 31.4 71.4 68.5 63.2 111 59 171 59s102.5 4.2 139.6 12.4C323.1 62 334.1 47.7 342 16.3 262.2 4.4 228 0 171 0z" fill="#e82127"/><path d="M171 59c-60 0-102.5 4.2-139.6 12.4 20.4 14.8 55.9 22.1 92.6 24.1L105.4 256H130l41-169 41 169h24.6L217 95.5c36.7-2 72.2-9.3 92.6-24.1C272.5 63.2 231 59 171 59z" fill="#fff"/></svg>
<div class="logo-text"><div class="logo-title">NAS UPLOAD</div><div class="logo-sub">SYNOLOGY FILE TRANSFER</div></div>
</div>
<div class="hpills">
<div class="pill" id="apiPill"><span class="dot a"></span> CONNECTING</div>
<div class="pill" id="storagePill"><span class="dot g"></span> -</div>
<button class="btn-logout" id="logoutBtn" style="display:none">LOCK</button>
</div>
</header>
<div class="stats-bar">
<div class="stat-card"><label>TOTAL FILES</label><span id="st-files">-</span></div>
<div class="stat-card"><label>USED SPACE</label><span id="st-size">-</span></div>
<div class="stat-card"><label>TODAY</label><span id="st-today">-</span></div>
<div class="stat-card"><label>FOLDERS</label><span id="st-folders">-</span></div>
</div>
<div class="tabs" id="tabsBar">
<button class="tab active" data-tab="upload">UPLOAD</button>
<button class="tab" data-tab="files">FILES</button>
<button class="tab" data-tab="storage">STORAGE</button>
</div>
<div class="tab-panel active" id="tab-upload">
<div class="drop-zone" id="dropZone">
<div class="drop-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div>
<div class="drop-title">DROP FILES HERE</div>
<div class="drop-hint">DASHCAM - VIDEO - IMAGES - UP TO 10 GB</div>
<button class="btn-browse" id="browseBtn">BROWSE FILES</button>
<input type="file" id="fileInput" multiple/>
</div>
<div class="q-summary" id="qSummary" style="display:none">
<div class="q-card"><label>QUEUED</label><span id="q-total">0</span></div>
<div class="q-card"><label>SIZE</label><span id="q-size">0</span></div>
<div class="q-card"><label>DONE</label><span id="q-done">0</span></div>
<div class="q-card"><label>FAILED</label><span id="q-fail">0</span></div>
</div>
<div id="queueSection" style="display:none">
<div class="sec-label" style="margin-bottom:10px">UPLOAD QUEUE</div>
<div class="file-list" id="fileList"></div>
</div>
<div class="action-bar" id="actionBar" style="display:none">
<button class="btn-sec" id="clearBtn">CLEAR</button>
<button class="btn-primary" id="uploadBtn">UPLOAD TO NAS</button>
</div>
</div>
<div class="tab-panel" id="tab-files">
<div class="browser-toolbar">
<input class="browser-search" id="fileSearch" placeholder="SEARCH FILES..."/>
<button class="btn-icon" id="refreshBtn">REFRESH</button>
</div>
<div id="filesWrap"><div class="empty-state">LOADING...</div></div>
</div>
<div class="tab-panel" id="tab-storage">
<div class="chart-wrap" id="storageChart"><div class="empty-state">LOADING...</div></div>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
"use strict";
var API = "/api";
var sessionToken = "";
try { sessionToken = localStorage.getItem("nas_token") || ""; } catch(e) {}
var allFiles = [];
var queue = [];
var pinBuf = "";

// Helpers
function $(id){ return document.getElementById(id); }
function setText(id, val){ var el = $(id); if (el) el.textContent = val; }

// XHR-based API helper (no fetch dependency)
function api(method, path, body, cb) {
  var xhr = new XMLHttpRequest();
  xhr.open(method, API + path, true);
  xhr.setRequestHeader("Content-Type", "application/json");
  if (sessionToken) xhr.setRequestHeader("x-session-token", sessionToken);
  xhr.onload = function() {
    if (xhr.status === 401) { showPin(); cb && cb(null, "unauthorized"); return; }
    var data = null;
    try { data = JSON.parse(xhr.responseText); } catch(e) {}
    if (xhr.status >= 200 && xhr.status < 300) cb && cb(data, null);
    else cb && cb(null, "HTTP " + xhr.status);
  };
  xhr.onerror = function() { cb && cb(null, "Network error"); };
  xhr.send(body ? JSON.stringify(body) : null);
}

// --- PIN screen ---
function showPin(){ var el = $("pinScreen"); if (el) el.classList.remove("hidden"); }
function hidePin(){ var el = $("pinScreen"); if (el) el.classList.add("hidden"); }
function updateDots(){
  for (var i = 0; i < 4; i++) {
    var d = $("pd" + i);
    if (d) {
      if (i < pinBuf.length) d.className = "pin-dot filled";
      else d.className = "pin-dot";
    }
  }
}
function pinKey(d) {
  if (pinBuf.length >= 4) return;
  pinBuf += d;
  updateDots();
  if (pinBuf.length === 4) setTimeout(pinSubmit, 120);
}
function pinDel() {
  pinBuf = pinBuf.slice(0, -1);
  updateDots();
  setText("pinErr", "");
}
function pinSubmit() {
  if (!pinBuf) return;
  api("POST", "/auth/login", { pin: pinBuf }, function(res, err) {
    if (res && res.token) {
      sessionToken = res.token;
      try { localStorage.setItem("nas_token", sessionToken); } catch(e) {}
      hidePin();
      var lb = $("logoutBtn");
      if (lb) lb.style.display = "";
      init();
    } else {
      setText("pinErr", "INCORRECT PIN");
      pinBuf = "";
      updateDots();
      setTimeout(function() { setText("pinErr", ""); }, 2000);
    }
  });
}
function logout() {
  api("POST", "/auth/logout", null, function() {});
  sessionToken = "";
  try { localStorage.removeItem("nas_token"); } catch(e) {}
  location.reload();
}

// --- Init ---
function init() {
  api("GET", "/health", null, function(res) {
    var p = $("apiPill");
    if (res && res.status === "ok") {
      if (p) p.innerHTML = '<span class="dot g"></span> ONLINE';
      if (res.authEnabled) { var lb = $("logoutBtn"); if (lb) lb.style.display = ""; }
    } else {
      if (p) p.innerHTML = '<span class="dot r"></span> OFFLINE';
    }
  });
  loadStats();
}

function loadStats() {
  api("GET", "/stats", null, function(d) {
    if (!d) return;
    setText("st-files", d.totalFiles);
    setText("st-size", parseFloat(d.totalSizeGB) > 0 ? d.totalSizeGB + " GB" : d.totalSizeMB + " MB");
    var today = new Date().toISOString().slice(0, 10);
    var td = d.byDate && d.byDate[today];
    setText("st-today", td ? td.count : 0);
    setText("st-folders", Object.keys(d.byDate || {}).length);
    var sp = $("storagePill");
    if (sp) sp.innerHTML = '<span class="dot g"></span> ' + d.totalSizeMB + ' MB';
    renderChart(d.byDate || {});
  });
}

// --- Tabs ---
function switchTab(name) {
  var tabs = document.querySelectorAll(".tab");
  for (var i = 0; i < tabs.length; i++) {
    if (tabs[i].getAttribute("data-tab") === name) tabs[i].classList.add("active");
    else tabs[i].classList.remove("active");
  }
  var panels = document.querySelectorAll(".tab-panel");
  for (var j = 0; j < panels.length; j++) panels[j].classList.remove("active");
  var p = $("tab-" + name);
  if (p) p.classList.add("active");
  if (name === "files") loadFiles();
  if (name === "storage") loadStats();
}

// --- Upload ---
function ext(n) { return n.split(".").pop().toLowerCase(); }
function tc(n) {
  var e = ext(n);
  if (["mp4","mov","avi","mkv","ts","m4v","wmv"].indexOf(e) >= 0) return "video";
  if (["jpg","jpeg","png","gif","webp","heic","bmp"].indexOf(e) >= 0) return "image";
  if (["pdf","doc","docx","txt","csv","xlsx"].indexOf(e) >= 0) return "doc";
  return "other";
}
function fsz(b) {
  if (b < 1024) return b + "B";
  if (b < 1048576) return (b / 1024).toFixed(1) + "KB";
  if (b < 1073741824) return (b / 1048576).toFixed(1) + "MB";
  return (b / 1073741824).toFixed(2) + "GB";
}
function escHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function addFiles(files) {
  for (var i = 0; i < files.length; i++) {
    queue.push({ file: files[i], id: "f" + Math.random().toString(36).slice(2), status: "pending", progress: 0, error: "" });
  }
  renderQueue();
  $("qSummary").style.display = "grid";
  $("queueSection").style.display = "block";
  $("actionBar").style.display = "flex";
  updateQS();
}
function renderQueue() {
  var l = $("fileList");
  l.innerHTML = "";
  for (var i = 0; i < queue.length; i++) {
    var item = queue[i];
    var t = tc(item.file.name);
    var ex = ext(item.file.name).toUpperCase().slice(0, 4);
    var d = document.createElement("div");
    d.className = "fi " + item.status;
    d.id = "fi-" + item.id;
    d.innerHTML =
      '<div class="ftype ' + t + '">' + escHtml(ex) + '</div>' +
      '<div class="finfo"><div class="fname">' + escHtml(item.file.name) + '</div>' +
      '<div class="fmeta" id="fm-' + item.id + '">' + fsz(item.file.size) + '</div></div>' +
      '<div class="fprog"><div class="pb"><div class="pf ' + item.status + '" id="pf-' + item.id + '" style="width:' + item.progress + '%"></div></div>' +
      '<div class="pp" id="pp-' + item.id + '">-</div></div>' +
      '<div class="fst ' + item.status + '" id="fs-' + item.id + '">' + item.status.toUpperCase() + '</div>';
    l.appendChild(d);
  }
}
function updateQI(item) {
  var w = $("fi-" + item.id);
  if (w) w.className = "fi " + item.status;
  var pf = $("pf-" + item.id);
  if (pf) { pf.style.width = item.progress + "%"; pf.className = "pf " + item.status; }
  setText("pp-" + item.id, item.progress + "%");
  var fs = $("fs-" + item.id);
  if (fs) { fs.textContent = item.status.toUpperCase(); fs.className = "fst " + item.status; }
  var fm = $("fm-" + item.id);
  if (fm) fm.textContent = fsz(item.file.size) + (item.error ? " - " + item.error : "");
  updateQS();
}
function updateQS() {
  setText("q-total", queue.length);
  var total = 0, done = 0, fail = 0;
  for (var i = 0; i < queue.length; i++) {
    total += queue[i].file.size;
    if (queue[i].status === "done") done++;
    if (queue[i].status === "error") fail++;
  }
  setText("q-size", fsz(total));
  setText("q-done", done);
  setText("q-fail", fail);
}
function clearQueue() {
  queue = [];
  $("fileList").innerHTML = "";
  $("qSummary").style.display = "none";
  $("queueSection").style.display = "none";
  $("actionBar").style.display = "none";
  var btn = $("uploadBtn");
  btn.disabled = false;
  btn.textContent = "UPLOAD TO NAS";
}
function startUpload() {
  var pending = [];
  for (var i = 0; i < queue.length; i++) if (queue[i].status === "pending") pending.push(queue[i]);
  if (!pending.length) { showToast("No pending files", true); return; }
  var btn = $("uploadBtn");
  btn.disabled = true;
  btn.textContent = "UPLOADING...";
  uploadNext(pending, 0);
}
function uploadNext(pending, idx) {
  if (idx >= pending.length) {
    var btn = $("uploadBtn");
    var failed = 0;
    for (var i = 0; i < queue.length; i++) if (queue[i].status === "error") failed++;
    btn.textContent = failed ? "DONE - " + failed + " FAILED" : "ALL DONE";
    showToast(failed ? failed + " file(s) failed" : "Files saved to NAS!", failed > 0);
    loadStats();
    return;
  }
  doUpload(pending[idx], function() { uploadNext(pending, idx + 1); });
}
function doUpload(item, done) {
  item.status = "uploading";
  item.progress = 0;
  updateQI(item);
  var fd = new FormData();
  fd.append("files", item.file);
  var xhr = new XMLHttpRequest();
  xhr.open("POST", API + "/upload");
  if (sessionToken) xhr.setRequestHeader("x-session-token", sessionToken);
  if (xhr.upload) {
    xhr.upload.onprogress = function(e) {
      if (e.lengthComputable) { item.progress = Math.round(e.loaded / e.total * 100); updateQI(item); }
    };
  }
  xhr.onload = function() {
    item.status = (xhr.status === 200) ? "done" : "error";
    if (xhr.status !== 200) item.error = "HTTP " + xhr.status;
    item.progress = 100;
    updateQI(item);
    done();
  };
  xhr.onerror = function() { item.status = "error"; item.error = "Network error"; updateQI(item); done(); };
  xhr.send(fd);
}

// --- Files ---
function loadFiles() {
  var w = $("filesWrap");
  w.innerHTML = '<div class="empty-state">LOADING...</div>';
  api("GET", "/files", null, function(d) {
    if (d) {
      allFiles = d.files || [];
      renderFT(allFiles);
    } else {
      w.innerHTML = '<div class="empty-state">FAILED TO LOAD</div>';
    }
  });
}
function filterFiles() {
  var q = $("fileSearch").value.toLowerCase();
  if (!q) { renderFT(allFiles); return; }
  var f = [];
  for (var i = 0; i < allFiles.length; i++) {
    if (allFiles[i].name.toLowerCase().indexOf(q) >= 0 || allFiles[i].folder.toLowerCase().indexOf(q) >= 0) f.push(allFiles[i]);
  }
  renderFT(f);
}
function renderFT(files) {
  var w = $("filesWrap");
  if (!files.length) { w.innerHTML = '<div class="empty-state">NO FILES FOUND</div>'; return; }
  var html = '<table class="files-table"><thead><tr><th>FILENAME</th><th>FOLDER</th><th>SIZE</th><th>MODIFIED</th><th></th></tr></thead><tbody>';
  for (var i = 0; i < files.length; i++) {
    var f = files[i];
    var rp = encodeURIComponent(f.relPath);
    html += '<tr>' +
      '<td>' + escHtml(f.name) + '</td>' +
      '<td class="td-mono">' + escHtml(f.folder) + '</td>' +
      '<td class="td-mono">' + fsz(f.size) + '</td>' +
      '<td class="td-mono">' + escHtml(f.modified.slice(0, 16).replace("T", " ")) + '</td>' +
      '<td><div class="td-actions">' +
      '<button class="btn-dl" data-dl="' + rp + '">DL</button>' +
      '<button class="btn-rm" data-rm="' + rp + '" data-name="' + escHtml(f.name) + '">DEL</button>' +
      '</div></td></tr>';
  }
  html += '</tbody></table>';
  w.innerHTML = html;
}
function dlFile(rp) {
  var url = API + "/files/download?path=" + rp + "&token=" + encodeURIComponent(sessionToken);
  var a = document.createElement("a");
  a.href = url;
  a.download = "";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}
function rmFile(rp, name) {
  if (!confirm("Delete " + name + "?")) return;
  api("DELETE", "/files?path=" + rp, null, function(r) {
    if (r && r.success) { showToast(name + " deleted"); loadFiles(); loadStats(); }
    else showToast("Delete failed", true);
  });
}

// --- Chart ---
function renderChart(byDate) {
  var w = $("storageChart");
  var entries = [];
  for (var k in byDate) entries.push([k, byDate[k]]);
  entries.sort(function(a, b) { return b[0].localeCompare(a[0]); });
  entries = entries.slice(0, 14);
  if (!entries.length) { w.innerHTML = '<div class="empty-state">NO DATA</div>'; return; }
  var mx = 0;
  for (var i = 0; i < entries.length; i++) if (entries[i][1].size > mx) mx = entries[i][1].size;
  var html = '<div class="chart-title">UPLOAD HISTORY BY DATE</div>';
  for (var j = 0; j < entries.length; j++) {
    var pct = mx > 0 ? Math.round(entries[j][1].size / mx * 100) : 0;
    html += '<div class="chart-row">' +
      '<div class="chart-date">' + entries[j][0] + '</div>' +
      '<div class="chart-bar-bg"><div class="chart-bar-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="chart-val">' + fsz(entries[j][1].size) + ' ' + entries[j][1].count + 'f</div>' +
      '</div>';
  }
  w.innerHTML = html;
}

// --- Toast ---
function showToast(msg, isErr) {
  var t = $("toast");
  t.textContent = msg;
  t.className = "toast show" + (isErr ? " err" : "");
  setTimeout(function() { t.className = "toast"; }, 3200);
}

// --- Event delegation (works on Tesla's older Chromium) ---
document.addEventListener("DOMContentLoaded", function() {
  // PIN pad
  var pinPad = $("pinPad");
  if (pinPad) {
    pinPad.addEventListener("click", function(e) {
      var t = e.target;
      if (!t.classList.contains("pin-key")) return;
      var k = t.getAttribute("data-key");
      var a = t.getAttribute("data-action");
      if (k) pinKey(k);
      else if (a === "del") pinDel();
      else if (a === "submit") pinSubmit();
    });
  }
  // Logout
  var lb = $("logoutBtn");
  if (lb) lb.addEventListener("click", logout);
  // Tabs
  var tb = $("tabsBar");
  if (tb) tb.addEventListener("click", function(e) {
    var t = e.target;
    var name = t.getAttribute("data-tab");
    if (name) switchTab(name);
  });
  // Drop zone
  var dz = $("dropZone");
  var fi = $("fileInput");
  if (dz && fi) {
    dz.addEventListener("dragover", function(e) { e.preventDefault(); dz.classList.add("drag-over"); });
    dz.addEventListener("dragleave", function() { dz.classList.remove("drag-over"); });
    dz.addEventListener("drop", function(e) {
      e.preventDefault();
      dz.classList.remove("drag-over");
      var fs = [];
      for (var i = 0; i < e.dataTransfer.files.length; i++) fs.push(e.dataTransfer.files[i]);
      addFiles(fs);
    });
    var bb = $("browseBtn");
    if (bb) bb.addEventListener("click", function() { fi.click(); });
    fi.addEventListener("change", function() {
      var fs = [];
      for (var i = 0; i < fi.files.length; i++) fs.push(fi.files[i]);
      addFiles(fs);
      fi.value = "";
    });
  }
  // Upload action buttons
  var cb = $("clearBtn");
  if (cb) cb.addEventListener("click", clearQueue);
  var ub = $("uploadBtn");
  if (ub) ub.addEventListener("click", startUpload);
  // Files tab
  var sf = $("fileSearch");
  if (sf) sf.addEventListener("input", filterFiles);
  var rb = $("refreshBtn");
  if (rb) rb.addEventListener("click", loadFiles);
  // Files table delegation (DL/DEL)
  var fw = $("filesWrap");
  if (fw) fw.addEventListener("click", function(e) {
    var t = e.target;
    var dl = t.getAttribute("data-dl");
    var rm = t.getAttribute("data-rm");
    if (dl) dlFile(dl);
    else if (rm) rmFile(rm, t.getAttribute("data-name") || "file");
  });

  // Boot: check auth
  api("GET", "/auth/check", null, function(r, err) {
    if (!r) { showPin(); return; }
    if (!r.authRequired || r.authenticated) {
      hidePin();
      init();
    } else {
      showPin();
    }
  });
});
})();
</script>
